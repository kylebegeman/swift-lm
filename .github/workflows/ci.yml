name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - next

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The Xcode 27 image is a GitHub preview with a beta Xcode, so its result is reported without
    # blocking the workflow. Set `experimental` to false once the image and Xcode 27 are GA.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Xcode 26 (OS 26 SDKs)
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
            experimental: false
          - name: Xcode 27 (OS 27 SDKs, preview image)
            runner: xcode-27
            xcode: /Applications/Xcode_27.0.app
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "${{ matrix.xcode }}"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Strict build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Build for iOS, visionOS, and watchOS
        run: |
          for platform in iOS visionOS watchOS; do
            echo "Building for $platform"
            xcodebuild build \
              -scheme swift-lm-Package \
              -destination "generic/platform=$platform" \
              -quiet \
              CODE_SIGNING_ALLOWED=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          done

      - name: Validate
        run: ./scripts/validate.sh
